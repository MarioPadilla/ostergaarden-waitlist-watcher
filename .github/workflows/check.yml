name: Check waiting list

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_status:
        description: "Simulate a status change to test notifications (no state/history changes)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - open
          - closed

permissions:
  contents: write

# Never run two checks at once (they both write state.txt)
concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - name: Run check
        run: python check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_STATUS: ${{ inputs.force_status }}

      # Runs even if the check failed, so a state change is never lost
      - name: Commit state and history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.txt history.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update status [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Upload debug info
        if: failure() && hashFiles('debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
